name = "faire-part-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ── dev (par défaut) ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "faire-part-dev"
database_id = "REMPLACER_APRES_wrangler_d1_create"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "faire-part-photos-dev"

[vars]
# Domaine partagé pour l'offre catalogue : <slug>.SHARED_DOMAIN (cf. CLAUDE.md §8, nom pas encore choisi)
SHARED_DOMAIN = "faire-part.exemple"
# Domaine (ou sous-domaine) public du bucket R2 des photos, sans protocole ni slash final
PHOTOS_PUBLIC_URL = "https://photos-dev.faire-part.exemple"

# ── prod ──────────────────────────────────────────────────────────
[env.prod]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "faire-part-prod"
database_id = "REMPLACER_APRES_wrangler_d1_create"

[[env.prod.r2_buckets]]
binding = "PHOTOS"
bucket_name = "faire-part-photos-prod"

[env.prod.vars]
SHARED_DOMAIN = "faire-part.exemple"
PHOTOS_PUBLIC_URL = "https://photos.faire-part.exemple"
