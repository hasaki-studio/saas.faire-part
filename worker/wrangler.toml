name = "faire-part-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Effacement automatique des données d'invités 90 jours après le mariage
# (CLAUDE.md §5). 03:17 UTC : une heure creuse, et une minute qui n'est pas 0
# pour ne pas se ranger avec tout ce qui se déclenche au sommet de l'heure.
#
# Un Cron Trigger ne s'attache qu'à l'environnement déployé : celui-ci vaut pour
# dev, et [env.prod] a le sien. Sans cette répétition, la prod n'effacerait rien.
[triggers]
crons = ["17 3 * * *"]

# ── dev (par défaut) ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "faire-part-dev"
database_id = "e4fd5d58-53aa-408c-9b07-7a07974df238"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "faire-part-photos-dev"

# Limitation de débit du lookup public (CLAUDE.md §3, règle 5). 10 requêtes par
# minute et par IP : très largement au-dessus d'un invité qui ouvre son lien et
# le recharge deux fois, très largement en dessous du seuil qui rend le
# brute-force économique — l'alphabet à 30 caractères sur 8 positions donne
# 6,5·10¹¹ combinaisons, un attaquant limité à 10/min mettrait 45 millions
# d'années. C'est là contre les balayages automatiques et les moments de
# tension serveur, pas contre un scénario réaliste de devinette.
#
# `period` doit valoir 10 ou 60 : ce sont les deux seules valeurs qu'accepte
# l'API de Cloudflare aujourd'hui. `namespace_id` identifie la file de
# compteurs — il vit ici, ce n'est pas un secret, mais il doit rester unique
# sur le compte.
[[unsafe.bindings]]
name = "LOOKUP_RATE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# Domaine partagé pour l'offre catalogue : <slug>.SHARED_DOMAIN. Provisoire sur
# hasakistudio.fr (déjà possédé, coût 0) ; migration vers une marque dédiée
# prévue au 1er ou 2e client sur-mesure (cf. CLAUDE.md §8).
SHARED_DOMAIN = "dev.faire-part.hasakistudio.fr"
# Domaine (ou sous-domaine) public du bucket R2 des photos, sans protocole ni slash final
PHOTOS_PUBLIC_URL = "https://photos-dev.hasakistudio.fr"
# Hôte du tableau de bord du couple. Séparé de celui des invités : l'API des
# invités doit rester ouverte, le tableau de bord doit être derrière Cloudflare
# Access. Un seul hôte ne peut pas être les deux.
DASHBOARD_HOSTNAME = "tableau.dev.faire-part.hasakistudio.fr"
# Identifiants de l'application Access qui protège cet hôte. L'AUD se lit dans
# Zero Trust > Access > Applications > (l'application) > Overview, ligne
# « Application Audience (AUD) Tag ».
#
# Ne pas confondre avec l'« Application ID » affiché sur la même page : l'AUD
# fait 64 caractères hexadécimaux sans tiret, l'Application ID est un UUID de
# 36 caractères avec tirets. Se tromper ne casse rien au déploiement — le
# Worker part, puis rejette chaque requête du tableau de bord en 403 et la page
# reste vide sans message utile. L'erreur a été faite une fois ici.
#
# Le team domain n'a rien à voir avec nos noms de domaine : Cloudflare l'attribue
# à l'inscription à Zero Trust, souvent sous une forme tirée au sort du genre
# « small-bird-358e ». Il se lit dans Zero Trust > Settings > Custom Pages, ligne
# « Team domain », et c'est aussi l'hôte de la page qui demande le code à six
# chiffres. Le deviner d'après la marque ne marche pas — essayé, raté : le Worker
# ne trouve alors pas les clés publiques d'Access, aucune signature ne se vérifie,
# et tout repart en 403 « Non authentifié » sans rien dire de plus.
ACCESS_TEAM_DOMAIN = "small-bird-358e.cloudflareaccess.com"
ACCESS_AUD = "3f1b10304ccb380a17175c4237ee8f875381e8447f97329eb172548cacd76b87"

# Vue de suivi opérationnel : une seule adresse pour l'instant, la mienne.
# Séparée du tableau de bord des couples (hôte différent, application Access
# différente, AUD différente), pour qu'un couple ne puisse pas atteindre
# /api/admin/* en présentant son propre jeton d'Access. La liste est en
# variable et non en base : on ne fait pas d'UI pour gérer des admins qu'on
# est un.
ADMIN_HOSTNAME = "admin.dev.faire-part.hasakistudio.fr"
ADMIN_ACCESS_AUD = "REMPLACER_PAR_L_AUD_DE_L_APPLICATION_ACCESS_ADMIN"
ADMIN_EMAILS = "azouzi.achraf@gmail.com"

# Connexion simulée pour `wrangler dev` : sans Access devant le Worker en local,
# il n'y a pas de jeton à vérifier. N'a d'effet que sur localhost, et n'existe
# pas dans [env.prod.vars] — deux verrous plutôt qu'un.
DEV_EMAIL = "couple@exemple.fr"
# Même mécanique côté admin : DEV_ADMIN_EMAIL agit comme la connexion simulée
# pour l'hôte admin en local. Doit figurer dans ADMIN_EMAILS pour être accepté.
DEV_ADMIN_EMAIL = "azouzi.achraf@gmail.com"

# ── prod ──────────────────────────────────────────────────────────
[env.prod]

[env.prod.triggers]
crons = ["17 3 * * *"]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "faire-part-prod"
database_id = "REMPLACER_APRES_wrangler_d1_create"

[[env.prod.r2_buckets]]
binding = "PHOTOS"
bucket_name = "faire-part-photos-prod"

# Namespace distinct de dev : sans quoi une attaque en dev partagerait le
# compteur avec la prod et bloquerait de vrais invités.
[[env.prod.unsafe.bindings]]
name = "LOOKUP_RATE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[env.prod.vars]
SHARED_DOMAIN = "faire-part.hasakistudio.fr"
PHOTOS_PUBLIC_URL = "https://photos.hasakistudio.fr"
DASHBOARD_HOSTNAME = "tableau.faire-part.hasakistudio.fr"
ACCESS_TEAM_DOMAIN = "small-bird-358e.cloudflareaccess.com"
ACCESS_AUD = "REMPLACER_PAR_L_AUD_DE_L_APPLICATION_ACCESS_PROD"

ADMIN_HOSTNAME = "admin.faire-part.hasakistudio.fr"
ADMIN_ACCESS_AUD = "REMPLACER_PAR_L_AUD_DE_L_APPLICATION_ACCESS_ADMIN_PROD"
ADMIN_EMAILS = "azouzi.achraf@gmail.com"
# Pas de DEV_EMAIL ni DEV_ADMIN_EMAIL ici : volontaire.
