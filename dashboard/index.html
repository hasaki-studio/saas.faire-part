<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Un Oui, Une Histoire</title>
<!-- Une page protégée par Cloudflare Access n'a rien à faire dans un index de
     moteur de recherche, même si Access la refuserait au robot. -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --encre: #2f3b33;
    --doux: #6b7a6f;
    --feuille: #7c9473;
    --fond: #fbfaf7;
    --carte: #ffffff;
    --trait: #e6e4dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--fond);
    color: var(--encre);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 600; }
  .sous-titre { color: var(--doux); margin: 0 0 28px; font-size: 0.95rem; }

  .chiffres { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .chiffre {
    flex: 1 1 140px; background: var(--carte); border: 1px solid var(--trait);
    border-radius: 10px; padding: 14px 16px;
  }
  .chiffre b { display: block; font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
  .chiffre span { color: var(--doux); font-size: 0.85rem; }

  /* Sans indicateur d'avancement, le couple abandonne en cours de saisie
     (cf. CLAUDE.md §4). */
  .avancement { background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 14px 16px; margin-bottom: 24px; }
  .jauge { height: 8px; background: var(--trait); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .jauge > div { height: 100%; background: var(--feuille); width: 0; transition: width .4s; }

  .barre-outils { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .barre-outils input[type=search] {
    flex: 1 1 220px; padding: 9px 12px; border: 1px solid var(--trait);
    border-radius: 8px; font: inherit; background: var(--carte);
  }
  button, .bouton {
    font: inherit; padding: 9px 14px; border: 1px solid var(--trait);
    background: var(--carte); color: var(--encre); border-radius: 8px; cursor: pointer;
    text-decoration: none;
  }
  button:hover, .bouton:hover { border-color: var(--feuille); }

  table { width: 100%; border-collapse: collapse; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--trait); font-size: 0.93rem; vertical-align: top; }
  th { font-weight: 600; color: var(--doux); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td.accompagnant .nom { padding-left: 18px; color: var(--doux); }
  td.accompagnant .nom::before { content: "↳ "; }

  .etiquette { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; border: 1px solid var(--trait); }
  .oui { background: #eef4ea; border-color: #cfe0c6; }
  .non { background: #f6efee; border-color: #e3cfcc; }
  .attente { color: var(--doux); }

  .lien-copie { font-size: 0.8rem; }
  .message { color: var(--doux); font-style: italic; }
  .etat { padding: 32px 0; color: var(--doux); }
  .erreur { color: #8a4a41; }
  @media (max-width: 640px) {
    .masquable { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1 id="titre">Tableau de bord</h1>
  <p class="sous-titre" id="sous-titre">Chargement…</p>

  <div id="contenu" hidden>
    <div class="chiffres" id="chiffres"></div>

    <div class="avancement">
      <div id="avancement-texte"></div>
      <div class="jauge"><div id="jauge-barre"></div></div>
    </div>

    <div class="barre-outils">
      <input type="search" id="recherche" placeholder="Rechercher un invité" aria-label="Rechercher un invité">
      <button type="button" id="export">Export traiteur (CSV)</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Invité</th>
          <th>Réponse</th>
          <th class="masquable">Régime</th>
          <th class="masquable">Message reçu</th>
          <th>Lien</th>
        </tr>
      </thead>
      <tbody id="lignes"></tbody>
    </table>
  </div>

  <p class="etat" id="etat"></p>
</main>

<script>
// Même origine que le tableau de bord : le Worker répond sur /api/tableau/* du
// même hôte, donc pas de CORS et le cookie d'Access part tout seul.
const API = "";

const REGIMES = {
  vegetarien: "Végétarien",
  vegan: "Vegan",
  halal: "Halal",
  casher: "Casher",
  sans_gluten: "Sans gluten",
};

let convives = [];

const $ = (id) => document.getElementById(id);
const txt = (v) => (v == null ? "" : String(v));

function etat(message, erreur) {
  const el = $("etat");
  el.textContent = message;
  el.className = erreur ? "etat erreur" : "etat";
  el.hidden = !message;
}

async function lire(chemin) {
  const res = await fetch(API + chemin, { headers: { accept: "application/json" } });
  if (res.status === 403) throw new Error("acces");
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}

function dateFr(iso) {
  if (!iso) return "";
  const [a, m, j] = iso.slice(0, 10).split("-");
  return `${j}/${m}/${a}`;
}

// Sans indicateur d'avancement, le couple abandonne en cours de saisie
// (cf. CLAUDE.md §4).
function phraseAvancement(avecMessage, total) {
  if (total === 0) return "Aucun invité pour le moment.";
  if (avecMessage === 0) return `Aucun de vos ${total} invités n'a encore son message personnalisé.`;
  if (avecMessage === 1) return `1 invité sur ${total} a son message personnalisé.`;
  return `${avecMessage} invités sur ${total} ont leur message personnalisé.`;
}

function nombres() {
  // Un accompagnant n'a pas répondu lui-même : il a été annoncé. Il compte
  // dans les convives à table, pas dans les réponses attendues.
  const invites = convives.filter((c) => !c.accompagnant_de);
  const oui = convives.filter((c) => c.presence === "oui").length;
  const non = invites.filter((c) => c.presence === "non").length;
  const attente = invites.filter((c) => !c.presence).length;

  $("chiffres").innerHTML = [
    [invites.length, "invités"],
    [oui, "à table"],
    [non, "déclinent"],
    [attente, "sans réponse"],
  ]
    .map(([n, l]) => `<div class="chiffre"><b>${n}</b><span>${l}</span></div>`)
    .join("");

  const avecMessage = invites.filter((c) => c.a_message).length;
  $("avancement-texte").textContent = phraseAvancement(avecMessage, invites.length);
  $("jauge-barre").style.width = invites.length ? (avecMessage / invites.length) * 100 + "%" : "0";
}

function etiquettePresence(c) {
  if (c.presence === "oui") return '<span class="etiquette oui">Oui</span>';
  if (c.presence === "non") return '<span class="etiquette non">Non</span>';
  return '<span class="attente">en attente</span>';
}

function afficher(filtre) {
  const f = filtre.trim().toLowerCase();
  const visibles = f
    ? convives.filter((c) => `${c.prenom} ${c.nom}`.toLowerCase().includes(f))
    : convives;

  $("lignes").innerHTML = visibles
    .map((c) => {
      const nom = `${txt(c.prenom)} ${txt(c.nom)}`.trim();
      const lien = c.lien
        ? `<button type="button" class="lien-copie" data-lien="${c.lien}">Copier</button>`
        : '<span class="attente">—</span>';
      return `<tr>
        <td class="${c.accompagnant_de ? "accompagnant" : ""}"><span class="nom">${nom}</span></td>
        <td>${etiquettePresence(c)}</td>
        <td class="masquable">${REGIMES[c.regime_alimentaire] || ""}</td>
        <td class="masquable message">${txt(c.message_invite)}</td>
        <td>${lien}</td>
      </tr>`;
    })
    .join("");

  if (!visibles.length) {
    $("lignes").innerHTML = '<tr><td colspan="5" class="attente">Aucun invité ne correspond.</td></tr>';
  }
}

// Export pour le traiteur : qui vient, et qui mange quoi. Construit dans le
// navigateur à partir des données déjà chargées — pas de route de plus à
// protéger côté Worker.
function exporterCsv() {
  const guillemets = (v) => `"${txt(v).replace(/"/g, '""')}"`;
  const lignes = [["Prénom", "Nom", "Présence", "Régime", "Annoncé par"]]
    .concat(
      convives
        .filter((c) => c.presence === "oui")
        .map((c) => {
          const parent = c.accompagnant_de
            ? convives.find((p) => p.id === c.accompagnant_de)
            : null;
          return [
            c.prenom,
            c.nom,
            "oui",
            REGIMES[c.regime_alimentaire] || "",
            parent ? `${parent.prenom} ${parent.nom}` : "",
          ];
        }),
    )
    .map((l) => l.map(guillemets).join(","))
    .join("\r\n");

  // ﻿ : sans ce BOM, Excel lit le CSV en latin-1 et abîme les accents.
  const a = document.createElement("a");
  a.href = "data:text/csv;charset=utf-8," + encodeURIComponent("﻿" + lignes + "\r\n");
  a.download = "traiteur.csv";
  a.click();
}

$("lignes").addEventListener("click", (e) => {
  const bouton = e.target.closest("[data-lien]");
  if (!bouton) return;
  navigator.clipboard.writeText(bouton.dataset.lien).then(
    () => {
      bouton.textContent = "Copié";
      setTimeout(() => (bouton.textContent = "Copier"), 1500);
    },
    () => (bouton.textContent = bouton.dataset.lien),
  );
});

$("recherche").addEventListener("input", (e) => afficher(e.target.value));
$("export").addEventListener("click", exporterCsv);

(async function demarrer() {
  try {
    const [{ mariage }, liste] = await Promise.all([
      lire("/api/tableau/mariage"),
      lire("/api/tableau/convives"),
    ]);
    convives = liste.convives;

    document.title = `${mariage.prenom_1} & ${mariage.prenom_2} — Tableau de bord`;
    $("titre").textContent = `${mariage.prenom_1} & ${mariage.prenom_2}`;
    $("sous-titre").textContent =
      `Mariage le ${dateFr(mariage.date_mariage)} · réponses attendues avant le ${dateFr(mariage.date_limite_rsvp)}`;

    nombres();
    afficher("");
    $("contenu").hidden = false;
    etat("");
  } catch (e) {
    $("sous-titre").textContent = "";
    etat(
      e.message === "acces"
        ? "Cette session n'est rattachée à aucun mariage. Si vous venez de recevoir vos accès, réessayez après vous être reconnecté."
        : "Le tableau de bord n'a pas pu être chargé. Réessayez dans un instant.",
      true,
    );
  }
})();
</script>
</body>
</html>
